<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>城市人格测试 · 找到你的本命宜居城</title>
<style>
  :root{
    --pink:#ff7eb3; --pink-soft:#ffd3e6; --lav:#b388eb; --lav-soft:#e9defb;
    --mint:#a0e7d2; --peach:#ffd6a5; --cream:#fff6fb; --ink:#5a4a52; --ink-soft:#9a8a92;
    --card:#ffffff; --shadow:0 10px 30px rgba(255,126,179,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink); background:linear-gradient(160deg,#ffe9f3 0%,#f3e9ff 50%,#e6fbf3 100%);
    min-height:100vh; display:flex; justify-content:center;
  }
  .app{width:100%;max-width:480px;min-height:100vh;padding:0 18px 40px;position:relative;overflow:hidden;}
  .blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.5;z-index:0;}
  .b1{width:180px;height:180px;background:var(--pink-soft);top:-40px;right:-50px;}
  .b2{width:160px;height:160px;background:var(--lav-soft);bottom:60px;left:-50px;}
  .b3{width:120px;height:120px;background:var(--mint);top:40%;right:-30px;opacity:.35;}
  .wrap{position:relative;z-index:1;}
  .topbar{display:flex;align-items:center;justify-content:center;padding:18px 0 6px;}
  .logo{font-size:15px;font-weight:700;letter-spacing:1px;color:var(--pink);}
  .logo span{background:linear-gradient(90deg,var(--pink),var(--lav));-webkit-background-clip:text;background-clip:text;color:transparent;}

  /* 进度条 */
  .progress{height:8px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:var(--shadow);margin:6px 0 18px;}
  .progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--lav));border-radius:99px;transition:width .35s ease;}

  /* 卡片通用 */
  .card{background:var(--card);border-radius:26px;padding:22px 20px;box-shadow:var(--shadow);margin-bottom:16px;}
  .center{text-align:center;}

  /* 首页 */
  .hero{padding:30px 22px;text-align:center;margin-top:10px;}
  .hero .emoji{font-size:54px;line-height:1;margin-bottom:10px;animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .hero h1{font-size:25px;margin:6px 0 8px;font-weight:800;background:linear-gradient(90deg,var(--pink),var(--lav));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{font-size:14px;color:var(--ink-soft);line-height:1.7;margin:8px 0;}
  .tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 4px;}
  .tags b{font-size:12px;background:var(--cream);color:var(--pink);padding:6px 12px;border-radius:99px;border:1px solid var(--pink-soft);}
  .stats{display:flex;justify-content:space-around;margin-top:14px;}
  .stats div{text-align:center;}
  .stats .n{font-size:20px;font-weight:800;color:var(--lav);}
  .stats .t{font-size:11px;color:var(--ink-soft);}

  .btn{display:block;width:100%;border:none;cursor:pointer;font-size:16px;font-weight:700;color:#fff;
    background:linear-gradient(90deg,var(--pink),var(--lav));padding:16px;border-radius:99px;
    box-shadow:0 8px 20px rgba(255,126,179,.4);transition:transform .15s;}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:#fff;color:var(--pink);border:2px solid var(--pink-soft);box-shadow:none;}

  /* 题目 */
  .q-emoji{font-size:40px;text-align:center;margin-bottom:4px;}
  .q-title{font-size:19px;font-weight:800;text-align:center;line-height:1.5;margin:6px 0 4px;}
  .q-sub{font-size:12px;color:var(--ink-soft);text-align:center;margin-bottom:16px;}
  .opt{display:flex;align-items:center;gap:12px;background:var(--cream);border:2px solid transparent;
    border-radius:18px;padding:15px 16px;margin-bottom:11px;cursor:pointer;transition:all .18s;font-size:15px;}
  .opt:active{transform:scale(.98);}
  .opt.sel{border-color:var(--pink);background:#fff0f7;box-shadow:0 6px 16px rgba(255,126,179,.2);}
  .opt .ic{font-size:22px;width:30px;text-align:center;flex:none;}

  /* 结果 */
  .persona{text-align:center;padding:26px 20px;}
  .persona .pe{font-size:50px;}
  .persona .pl{font-size:22px;font-weight:800;margin:6px 0;
    background:linear-gradient(90deg,var(--pink),var(--lav));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .persona .pd{font-size:13px;color:var(--ink-soft);line-height:1.7;}
  .city{position:relative;overflow:hidden;}
  .city .rank{position:absolute;top:14px;right:16px;font-size:12px;color:#fff;background:linear-gradient(90deg,var(--pink),var(--lav));padding:4px 10px;border-radius:99px;font-weight:700;}
  .city .cname{font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .city .cprov{font-size:12px;color:var(--ink-soft);font-weight:400;}
  .badge{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--lav-soft);color:var(--lav);font-weight:700;}
  .match{display:flex;align-items:baseline;gap:6px;margin:10px 0;}
  .match .pct{font-size:34px;font-weight:900;color:var(--pink);line-height:1;}
  .match .lab{font-size:12px;color:var(--ink-soft);}
  .mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;}
  .mini div{background:var(--cream);border-radius:14px;padding:9px 11px;font-size:12px;}
  .mini b{display:block;color:var(--ink);font-size:13px;margin-top:2px;font-weight:700;}
  .mini span{color:var(--ink-soft);}
  .reason{font-size:13px;line-height:1.8;color:var(--ink);background:#fff7fb;border-left:3px solid var(--pink);border-radius:0 12px 12px 0;padding:10px 12px;margin:10px 0;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 2px;}
  .chip{font-size:12px;background:var(--mint);color:#2c6b54;padding:5px 11px;border-radius:99px;}
  .chip.f{background:var(--peach);color:#9a5b1d;}
  .sec-t{font-size:13px;font-weight:700;color:var(--lav);margin:10px 0 2px;}
  .pay{text-align:center;padding:20px;}
  .pay .pp{font-size:30px;font-weight:900;color:var(--pink);}
  .pay .pt{font-size:13px;color:var(--ink-soft);margin:4px 0 14px;line-height:1.7;}
  .share-tip{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:12px;line-height:1.7;}
  .foot{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:18px;line-height:1.7;}
  .hidden{display:none!important;}
  .fade{animation:fade .4s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

  <div class="wrap">

      <div style="height:18px"></div>
      <button class="btn" onclick="start()">开始测试 →</button>
      <div class="foot">测试结果与城市数据仅供参考娱乐 · 实际定居请结合亲身体验</div>
    </section>

    <!-- 题目容器 -->
    <section id="quiz" class="hidden"></section>

    <!-- 结果 -->
    <section id="result" class="hidden"></section>
  </div>
</div>

 ]},

 ]},

   {ic:"🏘️",x:"有老街巷和烟火气",d:{vibe:.5,social:-.5}},
   {ic:"☕",x:"文艺小店+咖啡馆的慢城",d:{vibe:1.5,pace:-.5}},
   {ic:"⛰️",x:"推开窗就是山或海",d:{nature:1.5}}
 ]},
 {e:"🚀",t:"未来3年，你更想…",s:"诚实面对内心",opts:[
   {ic:"📈",x:"搞钱晋升，事业狂奔",d:{career:1.5,pace:1}},
   {ic:"☯️",x:"平衡工作与生活",d:{career:0,pace:0}},
   {ic:"💞",x:"恋爱成家安稳过日子",d:{career:-.5,social:-.5}},
   {ic:"🦋",x:"探索自我，自由生长",d:{career:-1,nature:.5}}
 ]},
 {e:"🍜",t:"你的口味更偏？",s:"决定城市美食同频度",opts:[
   {ic:"🌶️",x:"无辣不欢",food:"spicy"},
   {ic:"🍵",x:"清淡鲜美",food:"light"},
   {ic:"🦐",x:"海鲜河鲜控",food:"seafood"},
   {ic:"🍜",x:"面食党/啥都吃",food:"noodle"}
 ]},
 {e:"🐢",t:"你能接受的城市节奏？",s:"长期居住的体感",opts:[
   {ic:"🔥",x:"快节奏，机会多才带感",d:{pace:1.5}},
   {ic:"🌿",x:"适中就好，别太卷",d:{pace:0}},
   {ic:"🍃",x:"慢一点，享受生活",d:{pace:-1.5}}
 ]},
 {e:"🌟",t:"你最看重城市哪一点？",s:"只能选一个的话",opts:[
   {ic:"💼",x:"事业发展空间",d:{career:1,pace:.5}},
   {ic:"🛋️",x:"生活品质与松弛感",d:{pace:-1,nature:.5}},
   {ic:"🍢",x:"美食与烟火气",d:{social:-.5}},
   {ic:"🌊",x:"自然风光与气候",d:{nature:1.5,climate:.5}}
 ]},
 {e:"🏡",t:"你希望住在哪里周围？",s:"日常邻里画像",opts:[
   {ic:"🏢",x:"同龄人奋斗圈/商圈",d:{social:-1,career:.5}},
   {ic:"🎨",x:"文艺青年聚集地",d:{vibe:1,social:.5}},
   {ic:"🍲",x:"邻里烟火老社区",d:{social:.5,vibe:.5}},
   {ic:"🌲",x:"安静自然近郊",d:{nature:1.5,social:1}}
 ]},
 {e:"🚇",t:"对通勤的容忍度？",s:"每天来回的真实体感",opts:[
   {ic:"💪",x:"能接受长通勤换好工作",d:{pace:.5,career:.5}},
   {ic:"🕊️",x:"尽量短，时间要自由",d:{pace:-.5,nature:.5}},
   {ic:"🤷",x:"无所谓，看整体",d:{}}
 ]},
 {e:"💡",t:"你觉得自己更偏？",s:"能量来源小测试",opts:[
   {ic:"🗣️",x:"外向E，能量来自人群",d:{social:-1}},
   {ic:"📚",x:"内向I，独处才回血",d:{social:1}},
   {ic:"🔄",x:"看情况，灵活切换",d:{}}
 ]},
 {e:"🎯",t:"选城市你最怕的是？",s:"反向确认你的雷区",opts:[
   {ic:"😵",x:"太卷太贵压力山大",d:{cost:-1,pace:-.5}},
   {ic:"😶",x:"太无聊没朋友",d:{social:-.5,vibe:-.5}},
   {ic:"🥶",x:"气候不适应",d:{climate:-.5}},
   {ic:"📉",x:"机会太少没发展",d:{career:-.5}}
 ]}
];

/* ============ 逻辑 ============ */
let cur=0, want={pace:3,cost:3,climate:3,nature:3,vibe:3,social:3,career:3}, food=null, answers=[];
const DIMS=["pace","cost","climate","nature","vibe","social","career"];
const W={pace:1.2,cost:1.3,climate:1.2,nature:1,vibe:.9,social:1,career:1.1};

function start(){ document.getElementById('home').classList.add('hidden'); document.getElementById('quiz').classList.remove('hidden'); renderQ(); }

function renderQ(){
  const q=Q[cur];
  const prog=(cur/Q.length)*100;
  document.querySelector('#progress>i').style.width=prog+'%';
  let h=`<div class="card fade"><div class="q-emoji">${q.e}</div><div class="q-title">${q.t}</div><div class="q-sub">${q.s}（${cur+1}/${Q.length}）</div>`;
  q.opts.forEach((o,i)=>{
    const sel=(answers[cur]===i)?' sel':'';
    h+=`<div class="opt${sel}" onclick="pick(${i})"><span class="ic">${o.ic}</span><span>${o.x}</span></div>`;
  });
  h+=`</div>`;
  if(cur>0){
    h+=`<button class="btn ghost" style="margin-top:6px" onclick="prev()">← 上一题</button>`;
  }
  document.getElementById('quiz').innerHTML=h;
}
function prev(){ cur--; renderQ(); }
function pick(i){
  answers[cur]=i;
  const opts=document.querySelectorAll('#quiz .opt');
  opts.forEach(el=>el.classList.remove('sel'));
  opts[i].classList.add('sel');
  setTimeout(()=>{ cur++; if(cur<Q.length) renderQ(); else finish(); },180);
}
/* 统一从答案聚合，支持随时返回改选而不叠加 */
function aggregate(){
  let w={pace:3,cost:3,climate:3,nature:3,vibe:3,social:3,career:3};
  let f=null;
  answers.forEach((ai,qi)=>{
    if(ai==null) return;
    const o=Q[qi].opts[ai];
    if(o.d){ for(const k in o.d){ w[k]=Math.max(1,Math.min(5,(w[k]||3)+o.d[k])); } }
    if(o.food) f=o.food;
  });
  return {want:w,food:f};
}

function calc(){
  const res=CITIES.map(c=>{
    let sw=0, sc=0;
    DIMS.forEach(d=>{ const diff=Math.abs(c[d]-want[d]); const contrib=Math.max(0,1-diff/4); sw+=W[d]; sc+=W[d]*contrib; });
    let pct=100*sc/sw;
    if(food && c.food===food) pct+=4;
    pct=Math.max(50,Math.min(99,Math.round(pct)));
    return {c,pct};
  }).sort((a,b)=>b.pct-a.pct);
  return res;
}

function persona(){
  const w=want;
  if(w.career>=4 && w.pace>=4) return {e:"👩‍💻",l:"都市搞钱系",d:"你能量满满、目标清晰，需要一座机会密度高、能承载野心的一线或新一线城市。慢下来？不存在的，搞钱使你快乐。"};
  if(w.nature>=4 && w.pace<=3) return {e:"🌿",l:"山水疗愈系",d:"你渴望推窗见绿、呼吸自由。比起CBD的灯火，你更想要一座能安放身心的山水小城，把日子过成诗。"};
  if(w.climate>=4 && w.nature>=4) return {e:"🏖️",l:"滨海松弛系",d:"温暖的气候和开阔的水域是你的能量源。你适合一座不慌不忙、随时能看海听风的海滨城。"};
  if(w.vibe>=4 && w.pace<=3) return {e:"🎨",l:"文艺慢活系",d:"咖啡馆、老街巷、小众书店才是你的主场。你要的是有审美、有温度、能慢慢生活的城。"};
  if(w.vibe>=4 && w.nature<=3) return {e:"🏯",l:"古都沉淀系",d:"你钟情历史的厚度与文化的底气，喜欢在古城墙下散步、在博物馆里发呆的安稳感。"};
  if(w.cost>=4) return {e:"💎",l:"品质享受系",d:"你对生活质感有要求，预算不是束缚。你值得一座精致、便利、能托付好品味的城市。"};
  if(w.career<=2 && w.nature>=3) return {e:"🦋",l:"自由探险系",d:"你不被世俗节奏绑架，向往低压力、高自由的生活方式，一座包容性强的松弛之城最合你。"};
  return {e:"⚖️",l:"平衡生活系",d:"你不极端、不将就，想要事业与生活都能兼顾的城市。一座节奏适中、烟火与机会并存的地方最舒服。"};
}

function reasons(c){
  const r=[]; const w=want;
  if(Math.abs(c.climate-w.climate)<=1) r.push(c.climate>=4?"气候温暖宜人，正合你意 🌤️":"四季分明有质感，是你喜欢的调性 🍂");
  if(c.cost<=2 && w.cost<=3) r.push("房价与生活成本友好，钱包无压力 💰");
  if(Math.abs(c.pace-w.pace)<=1) r.push(c.pace>=4?"快节奏高能，给你施展空间 🚀":(c.pace<=2?"慢节奏松弛，刚好回血 🍃":"节奏适中，不卷不慌 ⚖️"));
  if(c.nature>=4 && w.nature>=3) r.push("自然山水环绕，治愈感拉满 🌿");
  if(c.vibe>=4 && w.vibe>=3) r.push("文艺古韵浓厚，审美在线 🎨");
  if(c.career>=4 && w.career>=3) r.push("产业活力强，搞钱机会多 💼");
  if(food && c.food===food) r.push("口味同频，吃货狂喜 🍜");
  if(r.length===0) r.push("综合画像与你契合，值得亲身探索 ✨");
  return r.slice(0,3);
}

function finish(){
  const agg=aggregate(); want=agg.want; food=agg.food;
  document.querySelector('#progress>i').style.width='100%';
  const res=calc(); const pe=persona(); const top=res.slice(0,3);
  let h=`<div class="card persona fade"><div class="pe">${pe.e}</div><div class="pl">你的城市人格 · ${pe.l}</div><div class="pd">${pe.d}</div></div>`;
  top.forEach((t,idx)=>{
    const c=t.c;
    h+=`<div class="card city fade">
      <div class="rank">No.${idx+1} 本命城</div>
      <div class="cname">${c.n}<span class="cprov">${c.p}</span></div>
      <span class="badge">${c.g==="搞钱组"?"💼 搞钱组":(c.g==="潜力组"?"🌱 潜力组":"🌸 宜居组")}</span>
      <div class="match"><span class="pct">${t.pct}%</span><span class="lab">灵魂契合度</span></div>
      <div class="mini">
        <div><span>房价</span><b>${c.price}万/㎡</b></div>
        <div><span>月生活成本</span><b>${c.living}元</b></div>
        <div><span>气候</span><b>${c.ct}</b></div>
        <div><span>城市节奏</span><b>${c.pace>=4?"快节奏":(c.pace<=2?"慢生活":"适中")}</b></div>
      </div>
      <div class="reason">💡 ${c.hl}。${reasons(c).join("；")}。</div>
      <div class="sec-t">🍜 必吃美食</div><div class="chips">${c.foods.map(f=>`<span class="chip f">${f}</span>`).join("")}</div>
      <div class="sec-t">📸 推荐玩法</div><div class="chips">${c.play.map(p=>`<span class="chip">${p}</span>`).join("")}</div>
    </div>`;
  });
  h+=`<div class="card fade" style="text-align:center;padding:26px 20px;">
      <div style="font-size:36px">💌</div>
      <div style="font-size:18px;font-weight:800;margin:8px 0 6px;background:linear-gradient(90deg,var(--pink),var(--lav));-webkit-background-clip:text;background-clip:text;color:transparent;">找到你的本命城了吗？</div>
      <div style="font-size:13px;color:var(--ink-soft);line-height:1.8;">把结果截图分享给闺蜜，一起测测谁的城市更香 🌸<br>也欢迎 @ 城市人格测试，看看大家都是什么系～</div>
      <button class="btn ghost" style="margin-top:16px" onclick="location.reload()">🔄 再测一次</button>
    </div>`;
  h+=`<div class="share-tip">📸 截图你的本命城，发朋友圈/小红书打卡吧～<br>测完记得 @ 你的城市人格测试</div>`;
  h+=`<div class="foot">本测试为娱乐参考工具，匹配结果不构成定居建议 · CitySoul 2026</div>`;
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').innerHTML=h;
  document.getElementById('result').classList.remove('hidden');
  window.scrollTo(0,0);
}
document.querySelectorAll('.cc').forEach(e=>e.textContent=CITIES.length);
</script>
